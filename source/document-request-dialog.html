<dialog id="documentRequestDialog" class="request-dialog" aria-labelledby="documentRequestTitle">
  <div class="request-dialog-header">
    <h2 id="documentRequestTitle">Запросить документы</h2>
    <button type="button" class="request-dialog-close" id="closeDocumentRequest" aria-label="Закрыть форму">×</button>
  </div>
  <div class="request-dialog-body">
    <p class="request-intro" id="documentRequestIntro">Оставьте контакты и укажите, какие материалы вам нужны.</p>
    <form id="documentRequestForm" class="request-form">
      <p class="request-required">* Обязательные поля</p>
      <input type="hidden" name="request_type" value="documents">
      <input type="hidden" name="system" id="requestSystem">
      <div class="request-form-row">
        <label for="requestName">Ваше имя <span aria-hidden="true">*</span><input id="requestName" name="name" required autocomplete="name" placeholder="Как к вам обращаться"></label>
        <label for="requestEmail">Почта для ответа <span aria-hidden="true">*</span><input id="requestEmail" name="email" type="email" required autocomplete="email" placeholder="name@company.ru"></label>
      </div>
      <div class="request-form-row">
        <label for="requestPhone">Телефон <span aria-hidden="true">*</span><input id="requestPhone" name="phone" type="tel" required autocomplete="tel" inputmode="tel" minlength="7" maxlength="25" placeholder="+7 (___) ___-__-__"></label>
        <label for="requestCity">Город <span aria-hidden="true">*</span><input id="requestCity" name="city" required autocomplete="address-level2" placeholder="Ваш город"></label>
      </div>
      <label for="requestCompany">Компания<input id="requestCompany" name="company" autocomplete="organization" placeholder="Название компании"></label>
      <label for="requestMessage">Какие документы нужны<textarea id="requestMessage" name="message" rows="3" placeholder="Каталог, инструкция, чертежи, IES или 3D-модели. При необходимости укажите артикулы."></textarea></label>
      <p class="request-demo-note">Локальный прототип: данные формы никуда не отправляются.</p>
      <div class="request-consents">
        <label><input type="checkbox" name="personal_data" required><span>Даю согласие на <a href="https://championled.ru/personal-data-consent" target="_blank" rel="noopener">обработку персональных данных</a> <span aria-hidden="true">*</span></span></label>
        <label><input type="checkbox" name="marketing"><span>Даю согласие на получение рекламно-информационных сообщений</span></label>
      </div>
      <button type="submit" class="btn">Отправить запрос</button>
    </form>
    <div id="documentRequestResult" class="request-result" hidden role="status">
      <h3 tabindex="-1">Запрос подготовлен</h3>
      <p>Форма заполнена. В локальном прототипе данные не отправлены.</p>
      <button type="button" class="text-link" id="returnDocumentRequest">Вернуться к форме</button>
    </div>
  </div>
</dialog>
